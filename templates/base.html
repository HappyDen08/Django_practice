<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .task-done {
            color: green;
            font-weight: bold;
        }
        .task-not-done {
            color: red;
            font-weight: bold;
        }
        .task-box {
            border-bottom: 1px solid #e1e1e1;
            padding: 15px 0;
        }
        .sidebar {
            height: 100vh;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .sidebar a {
            display: block;
            margin-bottom: 10px;
        }
        .main-content {
            padding: 20px;
        }
        .btn-right {
            float: right;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <a href="{% url 'to_do:home' %}" class="btn btn-outline-primary w-100 mb-2">Home</a>
            <a href="{% url 'to_do:tags_list' %}" class="btn btn-outline-primary w-100">Tags</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            {% block content %}
            <!-- Tasks will go here -->
            {% endblock %}
        </div>
    </div>
</div>
</body>
</html>
