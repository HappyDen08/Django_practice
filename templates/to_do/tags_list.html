{% extends "base.html" %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Tags</h2>
        <a href="{% url 'to_do:tag_create' %}" class="btn btn-primary btn-sm">Add</a>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for tag in tags_list %}
                <tr>
                    <td>{{ tag.name }}</td>
                    <td>
                        <a href="{% url 'to_do:update_tag' tag.id %}" class="btn btn-secondary btn-sm">Update</a>
                    </td>
                    <td>
                        <a href="{% url 'to_do:delete_tag' tag.id %}" class="btn btn-secondary btn-sm">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No tags found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
