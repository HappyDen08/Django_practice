{% extends 'base.html' %}

{% block content %}
    <h2>Update Task</h2>

    <form method="post" class="mt-4">
        {% csrf_token %}

        {{ form.content }}

        <input type="datetime-local" name="deadline" value="{{ form.instance.deadline|date:'Y-m-d\\TH:i' }}" class="form-control mt-2">

        <div class="mt-2">
            {% for tag in form.tags.field.queryset %}
                <label>
                    <input type="checkbox" name="tags" value="{{ tag.id }}"
                        {% if tag in form.instance.tags.all %}checked{% endif %}>
                    {{ tag.name }}
                </label>
            {% endfor %}
        </div>

        <div class="form-check mt-2">
            {{ form.is_done }}
            <label class="form-check-label" for="{{ form.is_done.id_for_label }}">
                Mark as done
            </label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Update</button>
        <a href="{% url 'to_do:home' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
{% endblock %}
